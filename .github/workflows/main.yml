name: Build NVN Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NVN_Reporter_Studio_build_prep.zip'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q NVN_Reporter_Studio_build_prep.zip -d project

      - name: Build APK
        working-directory: project/NVN_Android_Project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NVN-Reporter-Studio-APK
          path: project/NVN_Android_Project/app/build/outputs/apk/debug/app-debug.apk
